[loggers]
keys=root,kafka,processors,file_type,processors.unknown,processors.image,processors.video,connectors

[handlers]
keys=consoleHandler,fileHandlerKafka,fileHandlerAll,fileHandlerUnknownFile,fileHandlerImageFile,fileHandlerVideoFile

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandlerAll


[logger_kafka]
level=DEBUG
handlers=fileHandlerKafka
qualname=kafka
propagate=0

[logger_file_type]
level=DEBUG
handlers=consoleHandler,fileHandlerAll
qualname=file_type
propagate=0


[logger_processors]
level=DEBUG
handlers=consoleHandler,fileHandlerAll
qualname=processors
propagate=0

[logger_processors.unknown]
level=DEBUG
handlers=fileHandlerUnknownFile
qualname=processors.unknown
propagate=0

[logger_processors.image]
level=DEBUG
handlers=fileHandlerImageFile
qualname=processors.image
propagate=0


[logger_processors.video]
level=DEBUG
handlers=fileHandlerVideoFile
qualname=processors.video
propagate=0


[logger_connectors]
level=DEBUG
handlers=consoleHandler,fileHandlerAll
qualname=connectors
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandlerKafka]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('logs/kafka_all_%(log_date)s.log', 'w')

[handler_fileHandlerAll]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('logs/debug_all_%(log_date)s.log', 'w')

[handler_fileHandlerUnknownFile]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('logs/unknown_file_%(log_date)s.log', 'w')

[handler_fileHandlerImageFile]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('logs/image_file_%(log_date)s.log', 'w')


[handler_fileHandlerVideoFile]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('logs/video_file_%(log_date)s.log', 'w')


[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
